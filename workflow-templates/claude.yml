# Lets @claude answer and push fixes on issues and PRs in this repo, and has
# Claude review every PR automatically (approve, request changes or comment).
# The logic lives in testingbot/.github; this file only forwards the events.
name: Claude Code

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  claude:
    # A called workflow can only narrow these, never widen them.
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    uses: testingbot/.github/.github/workflows/claude.yml@main
    secrets: inherit

  review:
    if: github.event_name == 'pull_request'
    permissions:
      contents: read
      pull-requests: write
      id-token: write
      checks: read
      actions: read
    uses: testingbot/.github/.github/workflows/claude-review.yml@main
    secrets: inherit
