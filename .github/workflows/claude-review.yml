# Reusable automatic PR review for every testingbot repo.
#
# Repos call this from the stub in workflow-templates/claude.yml on
# pull_request events. Claude reads the diff once the PR's other checks have
# finished, then submits ONE review: approve, request changes, or comment.
#
# No testingbot ruleset requires approvals today (testingbot/web develop: 0),
# so an approval here is a signal, not a gate. If a ruleset ever requires one,
# decide first whether this bot's approval should count: most PRs in this org
# are written with Claude Code on a person's account, and nothing here can tell
# those from PRs a person wrote, so many approvals are Claude reviewing Claude.
name: Claude review (reusable)

on:
  workflow_call:
    secrets:
      ANTHROPIC_API_KEY:
        required: true

jobs:
  review:
    # Skipped:
    #   drafts - reviewed once marked ready (ready_for_review);
    #   bot authors - Dependabot runs get no Actions secrets, and a bot's PR is
    #     not one to approve on Claude's word anyway;
    #   forks - fork PRs get no secrets either (only public repos have them).
    if: |
      !github.event.pull_request.draft &&
      !endsWith(github.event.pull_request.user.login, '[bot]') &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A newer push makes the older review moot.
    concurrency:
      group: claude-review-${{ github.repository }}-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1

      # Approving a PR whose CI then fails is worse than not reviewing, so wait
      # for every other check on the head commit to finish first. This job's
      # own check is excluded by workflow name, or it would wait on itself.
      # Gives up after 30 minutes and lets Claude see whatever state is left;
      # the prompt forbids approving with checks unfinished.
      - name: Wait for the PR's other checks
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          SELF: ${{ github.workflow }}
        run: |
          deadline=$(( $(date +%s) + 1800 ))
          while :; do
            pending=$(gh pr checks "$PR" --repo "$GITHUB_REPOSITORY" --json name,state,workflow \
              --jq "[.[] | select(.workflow != \"$SELF\") | select(.state == \"PENDING\" or .state == \"QUEUED\" or .state == \"IN_PROGRESS\")] | length" \
              2>/dev/null || echo 1)
            [ "$pending" = 0 ] && { echo "all other checks finished"; break; }
            [ "$(date +%s)" -ge "$deadline" ] && { echo "still $pending pending after 30 min; reviewing anyway"; break; }
            echo "$pending check(s) still running"
            sleep 30
          done

      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            PR AUTHOR: ${{ github.event.pull_request.user.login }}

            Review this pull request. The PR branch is checked out in the
            working directory. Read the full diff with `gh pr diff` and the
            description with `gh pr view`, and open surrounding code where you
            need context. Look for correctness bugs, security problems, data
            loss, and changes that break existing callers. Do not raise style
            nits that a linter would catch.

            Then check CI with `gh pr checks`.

            Submit exactly ONE review with `gh pr review`:
            - `--approve` only if you found nothing blocking AND every check
              has completed and passed (skipped is fine; ignore the
              "Claude review" check itself, which is this run).
            - `--request-changes` if you found anything blocking. Say exactly
              what and where; put line-specific findings in inline comments with
              mcp__github_inline_comment__create_inline_comment (confirmed: true).
            - `--comment` if checks failed or are unfinished for reasons you
              cannot attribute to this change, or if you are unsure. Say why
              you did not approve.

            Start the review body with "Automated review by Claude." and state
            what you checked. Keep it short: findings first, no praise.
          claude_args: |
            --max-turns 30
            --allowedTools "Bash(gh pr review:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr checks:*),mcp__github_inline_comment__create_inline_comment"
